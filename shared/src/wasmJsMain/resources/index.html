<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- width=1920 keeps the layout consistent with a 1080p/4K TV panel; a
         real responsive app might branch on window size instead, but a fixed
         TV-sized viewport is the simpler, correct choice for this POC. -->
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>Dummy TV App</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #121212; /* matches the dark Material 3 theme; avoids a white flash before Compose paints */
            overflow: hidden;
        }
        /* Kotlin/Wasm takes a couple of seconds to boot before Compose ever
           composes App() (see PlatformFocusBridge.wasmJs.kt) -- without
           this, the page is a blank black screen for that whole window,
           which invites an early click. That early click can never actually
           enable keyboard navigation (Compose isn't mounted yet to see it,
           and there is no way to replay it once Compose does mount --
           confirmed against a real Chrome instance), so instead of trying
           to fake that, just make the blank window itself less likely to
           prompt a click by explaining what's happening. This bare-HTML
           element is naturally covered once Compose paints its own opaque
           background over it (Compose's root gets appended as a later
           sibling in `body`, so it paints and hit-tests on top). */
        #loading-hint {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 48px;
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div id="loading-hint">Loading...</div>
<script src="shared.js"></script>
</body>
</html>
